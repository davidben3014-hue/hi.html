<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hi Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: one centered button on a quiet field; the greeting replaces the prompt when clicked. */
:root {
  --bg: #f3f1ee;
  --fg: #1d1b22;
  --muted: #6b6775;
  --accent: #3d3bd6;
  --accent-fg: #ffffff;
  --ring: #a7a5f0;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141a; --fg: #f1eff6; --muted: #9a97a8;
    --accent: #8f8dff; --accent-fg: #15141a; --ring: #4a49a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141a; --fg: #f1eff6; --muted: #9a97a8;
  --accent: #8f8dff; --accent-fg: #15141a; --ring: #4a49a8;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  place-items: center;
}
main { display: grid; justify-items: center; gap: 28px; text-align: center; min-width: 0; }
#greeting {
  font-family: var(--font-display);
  font-size: clamp(4rem, 22vw, 11rem);
  line-height: 1;
  margin: 0;
  min-height: 1em;
  letter-spacing: -0.02em;
}
#greeting.pop { animation: pop 420ms cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#hint { color: var(--muted); margin: 0; min-height: 1.4em; }
button {
  font: 700 1.125rem/1 var(--font-body);
  letter-spacing: .08em;
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  border-radius: 999px;
  padding: 20px 40px;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ring); }
button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ring); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) {
  #greeting.pop { animation: none; }
  button { transition: none; }
}
</style>

<main>
  <h1 id="greeting" aria-live="polite"></h1>
  <button id="btn" type="button">CLICK HERE</button>
  <p id="hint">Go on, press it.</p>
</main>

<script>
  var greeting = document.getElementById("greeting");
  var hint = document.getElementById("hint");
  var count = 0;
  document.getElementById("btn").addEventListener("click", function () {
    count += 1;
    greeting.textContent = "HI";
    greeting.classList.remove("pop");
    void greeting.offsetWidth;
    greeting.classList.add("pop");
    hint.textContent = count === 1 ? "Hi there." : "Said hi " + count + " times.";
  });
</script>

</body></html>
